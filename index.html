<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insight Intermediate 5A — Crime Vocabulary</title>
<meta name="description" content="Free, unlimited flashcards for Insight Intermediate Unit 5A crime vocabulary. No paywall.">
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1f2430; --muted:#6b7280;
  --brand:#4255ff; --brand2:#7c3aed; --ok:#16a34a; --bad:#dc2626;
  --warn:#f59e0b; --line:#e5e7eb; --soft:#eef1f8; --radius:16px;
  --shadow:0 6px 24px rgba(20,25,60,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1220; --card:#191d2e; --ink:#eef1f8; --muted:#a2aac0;
    --line:#2a3049; --soft:#222741; --shadow:0 8px 28px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",Roboto,-apple-system,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer}
a{color:var(--brand)}

/* ---------- header ---------- */
header{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;padding:22px 18px 18px}
.wrap{max-width:960px;margin:0 auto}
.brandrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{
  width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.18);
  display:grid;place-items:center;font-size:24px;flex:0 0 auto;
}
h1{font-size:1.25rem;margin:0;font-weight:800;letter-spacing:.2px}
.sub{opacity:.92;font-size:.9rem;margin-top:2px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pill{
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
  padding:5px 11px;border-radius:999px;font-size:.78rem;font-weight:600;
}
.pill.free{background:#16a34a;border-color:#16a34a}

/* ---------- tabs ---------- */
nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:960px;margin:0 auto;padding:6px}
.tab{
  border:0;background:transparent;color:var(--muted);font-weight:700;
  padding:10px 14px;border-radius:10px;white-space:nowrap;display:flex;gap:7px;align-items:center;
}
.tab:hover{background:var(--soft);color:var(--ink)}
.tab.active{background:var(--brand);color:#fff}
.tab .ic{font-size:1rem}

/* ---------- main ---------- */
main{max-width:960px;margin:0 auto;padding:22px 16px 60px}
.panel{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);
}
.panel.shake-it{animation:shake .42s}
@keyframes shake{
  10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-8px)} 40%,60%{transform:translateX(8px)}
}
.flashbad,.flashgood{position:fixed;inset:0;pointer-events:none;z-index:60;animation:fadeout .6s forwards}
.flashbad{background:radial-gradient(circle at 50% 45%,rgba(220,38,38,.34),transparent 68%)}
.flashgood{background:radial-gradient(circle at 50% 45%,rgba(22,163,74,.24),transparent 68%)}
@keyframes fadeout{from{opacity:1}to{opacity:0}}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
h2{margin:0 0 4px;font-size:1.15rem}
h3{margin:18px 0 8px;font-size:1rem}
.hint{color:var(--muted);font-size:.88rem}
.mt{margin-top:16px}

.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:600}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.06);color:#fff}
.btn.ghost{background:transparent}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.badge-dot{background:var(--bad);color:#fff;border-radius:999px;font-size:.7rem;padding:1px 7px;font-weight:800;margin-left:2px}
.chip{border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:6px 12px;border-radius:999px;font-weight:600;font-size:.85rem}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}

.progress{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin:8px 0 0}

/* ---------- flashcards ---------- */
.cardstage{perspective:1400px;margin:16px 0}
.flipcard{position:relative;width:100%;min-height:290px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.2,.2,1);cursor:pointer}
.flipcard.flipped{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;padding:34px 26px;gap:14px;
}
.face .kind{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.face .big{font-size:clamp(1.35rem,4.5vw,2rem);font-weight:800;line-height:1.25}
.face .ex{color:var(--muted);font-size:.95rem;max-width:640px}
.face.back{transform:rotateY(180deg);background:linear-gradient(180deg,var(--card),var(--soft))}
.star{position:absolute;top:12px;right:12px;border:0;background:transparent;font-size:1.35rem;line-height:1;padding:6px;border-radius:50%}
.star:hover{background:var(--soft)}
.speak{position:absolute;top:12px;left:12px;border:1px solid var(--line);background:var(--card);border-radius:50%;width:38px;height:38px;font-size:1rem}
.speak:hover{border-color:var(--brand)}

/* ---------- quiz ---------- */
.qbox{min-height:220px;display:flex;flex-direction:column;gap:14px}
.qtext{font-size:clamp(1.1rem,3.6vw,1.5rem);font-weight:800;line-height:1.3}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:13px 15px;border-radius:12px;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--brand);background:var(--soft)}
.opt.correct{background:#dcfce7;border-color:var(--ok);color:#14532d;animation:pop .35s}
.opt.wrong{background:#fee2e2;border-color:var(--bad);color:#7f1d1d}
@keyframes pop{50%{transform:scale(1.03)}}
@media (prefers-color-scheme: dark){
  .opt.correct{background:#0f3320;color:#bbf7d0}
  .opt.wrong{background:#3a1414;color:#fecaca}
}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem}
.input:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.feedback{border-radius:12px;padding:12px 14px;font-weight:700;display:none}
.feedback.show{display:block;animation:slidein .25s}
@keyframes slidein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.feedback.good{background:#dcfce7;color:#14532d}
.feedback.bad{background:#fee2e2;color:#7f1d1d}
@media (prefers-color-scheme: dark){
  .feedback.good{background:#0f3320;color:#bbf7d0}
  .feedback.bad{background:#3a1414;color:#fecaca}
}
.tfrow{display:flex;gap:10px}

/* ---------- match ---------- */
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:14px 12px;border-radius:12px;font-weight:700;min-height:64px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.92rem}
.tile:hover{border-color:var(--brand)}
.tile.sel{border-color:var(--brand);background:#e4e8ff;box-shadow:0 0 0 3px var(--brand) inset;transform:translateY(-2px)}
@media (prefers-color-scheme: dark){ .tile.sel{background:#242c58} }
.tile.done{opacity:.3;pointer-events:none}
.tile.hit{animation:hitpop .32s}
@keyframes hitpop{50%{transform:scale(1.05)}}
.tile.wrong{border-color:var(--bad);animation:wrongfade .64s forwards}
@keyframes wrongfade{
  0%{background:rgba(220,38,38,.26);border-color:var(--bad);transform:translateY(-2px) scale(.98)}
  70%{background:rgba(220,38,38,.10);border-color:var(--bad)}
  100%{background:var(--card);border-color:var(--line);transform:none}
}
.timer{font-variant-numeric:tabular-nums;font-weight:800}

/* ---------- list ---------- */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
td .t{font-weight:800}
td .d{color:var(--muted);font-size:.92rem}
.center{text-align:center}
.bigscore{font-size:3rem;font-weight:900;line-height:1}
.starrow{display:flex;gap:8px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.starrow .txt{flex:1}
.starrow .t{font-weight:800;font-size:1.02rem}
.starrow .d{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- phone support ---------- */
*{ -webkit-tap-highlight-color:transparent }
button{ touch-action:manipulation }
html,body{ overflow-x:hidden }
@media(max-width:640px){
  header{ padding:15px 13px 13px }
  .logo{ width:38px;height:38px;font-size:21px }
  h1{ font-size:1.02rem }
  .sub{ font-size:.8rem }
  .badges{ gap:6px;margin-top:10px }
  .pill{ font-size:.71rem;padding:4px 9px }
  main{ padding:14px 10px 44px }
  .panel{ padding:14px;border-radius:14px }
  .tab{ padding:9px 11px;font-size:.92rem }
  .tab .ic{ font-size:.95rem }
  .btn{ padding:11px 14px }               /* bigger tap targets */
  .chip{ padding:8px 12px;font-size:.82rem }
  .row > .btn, .row > .opt{ min-height:44px }
  .opt{ padding:14px }
  .face{ padding:24px 16px }
  .flipcard{ min-height:240px }
  .face .big{ font-size:1.25rem }
  .face .ex{ font-size:.88rem }
  .star,.speak{ top:8px }
  .speak{ width:42px;height:42px }
  .star{ font-size:1.5rem;padding:8px }
  .matchgrid{ gap:8px }
  .tile{ min-height:58px;padding:12px 8px;font-size:.84rem }
  .qtext{ font-size:1.15rem }
  /* turn the List table into stacked cards */
  table thead{ display:none }
  table, tbody, tr, td{ display:block;width:100% }
  tr{ border-bottom:1px solid var(--line);padding:10px 0 }
  td{ border:0;padding:3px 0 }
  td:last-child{ padding-top:8px }
  .starrow{ flex-direction:column;gap:10px }
  .starrow .row{ justify-content:flex-start }
}
@media(max-width:380px){
  .tile{ font-size:.78rem;min-height:54px }
  h1{ font-size:.95rem }
}
</style>
</head>

<header>
  <div class="wrap">
    <div class="brandrow">
      <div class="logo">🕵️</div>

        <h1>Insight Intermediate 5A — Crime Vocabulary</h1>
        <div class="sub">Flashcards, Learn, Test, Match &amp; Write</div>
      </div>

    <div class="badges">
      <span class="pill free">✓ No paywall</span>

</header>

<div class="toast" id="toast"></div>

<script>
/* ---- word list (edit here to change the set) ---- */
/* =========================================================
   Insight Intermediate 5A — Crime vocabulary
   Word list provided for classroom study.
   Format: { t: term, d: definition (LT), e: optional example }
   Feel free to edit this file on GitHub and the site updates.
   ========================================================= */
window.TERMS = [
  {t:"a precaution", d:"a measure taken in advance to prevent harm (atsargumo priemonė)"},
  {t:"burglar-friendly", d:"not safe (vagių dėmesį patraukiantis)"},
  {t:"rusty", d:"covered with rust (aprudijęs)"},
  {t:"a vehicle", d:"something in which people or goods are carried from place to place (transporto priemonė)"},
  {t:"possession", d:"ownership (nuosavybė, daiktai)"},
  {t:"watchful", d:"always noticing what is happening, aware (akylas, pastabus)"},
  {t:"to draw attention to / on", d:"to watch, listen to, or think about something or someone carefully or with interest (kreipti dėmesį į)"},
  {t:"an open invitation", d:"a request to come into (atviras pakvietimas)"},
  {t:"property", d:"anything of value that is owned or controlled (nuosavybė)"},
  {t:"to keep an eye on", d:"to watch someone carefully (prižiūrėti)"},
  {t:"valuable", d:"worth a lot of money (vertingas)"},
  {t:"a crime prevention officer", d:"a member of the police who advises the public on how best to avoid crimes, esp being burgled (nusikaltimų prevencijos pareigūnas)"},
  {t:"to identify", d:"Find; point out (nustatyti, surasti, atpažinti)"},
  {t:"security", d:"safety (apsauga)"},
  {t:"sensible", d:"based on or acting on good judgment and practical ideas or understanding (protingas)"},

  {t:"nosy", d:"always trying to find out private things about other people (landus, įkyrus)"},
  {t:"plain", d:"simple, not fancy (paprastas)"},
  {t:"to set fire / to commit arson", d:"to start a fire intentionally (padegti)"},
  {t:"an arsonist", d:"a person who commits arson (padegėjas)"},
  {t:"arson", d:"the crime of deliberately setting fire to something (padegimas)"},
  {t:"to kidnap", d:"abduct (someone) and hold them captive, typically to obtain a ransom (pagrobti)"},
  {t:"a kidnapper", d:"someone who unlawfully seizes and detains a victim (usually for ransom) (pagrobėjas)"},
  {t:"kidnapping", d:"taking away a person against that person's will (pagrobimas)"},
  {t:"to murder", d:"to kill a person for no good reason (nužudyti)"},
  {t:"a murderer", d:"a person who kills another person (žudikas)"},
  {t:"a murder", d:"intentional killing of a person (žmogžudystė)"},
  {t:"to mug", d:"to attack someone violently in order to steal their money, especially in a public place (užpulti, apiplėšti)"},
  {t:"a mugger", d:"someone who attacks people in a public place and robs them (užpuolikas gatvėje, plėšikas)"},
  {t:"a mugging", d:"an attack on someone in which they are robbed in a public place (užpuolimas ir apiplėšimas gatvėje)"},
  {t:"to burgle", d:"to enter a building illegally, usually using force, and steal from it (įsilaužti, pavogti)"},
  {t:"a burglar", d:"a thief who enters a building with intent to steal (vagis, įsilaužėlis)"},
  {t:"a burglary", d:"the crime of getting into a building to steal things (vagystė iš pastatų)"},
  {t:"to rob", d:"to steal money or property from a person, bank (apiplėšti)"},
  {t:"a robber", d:"someone who steals money or property (plėšikas, banditas)"},
  {t:"a robbery", d:"the crime of stealing money or things from a bank, shop (apiplėšimas - banko, įstaigų)"},
  {t:"to steal", d:"to take something that belongs to someone else (pavogti)"},
  {t:"a thief", d:"a person who steals (vagis)"},
  {t:"a theft", d:"stealing (vagystė)"},
  {t:"to shoplift", d:"steal in a store (vogti iš parduotuvių)"},
  {t:"a shoplifter", d:"a thief who steals goods that are in a store (vagis, vagiantis iš parduotuvių)"},
  {t:"a shoplifting", d:"the act of stealing goods from a store (vagystės iš parduotuvių)"},
  {t:"to vandalise", d:"destroy or damage public property (elgtis huliganiškai)"},
  {t:"a vandal", d:"a person who destroys property (huliganas)"},
  {t:"a vandalism", d:"intentionally damaging or destroying another person's property (huliganizmas)"},
  {t:"to hijack", d:"to seize or take control of a vehicle by force (pagrobti)"},
  {t:"a hijacker", d:"a person who takes control of a plane and makes the pilot fly to a different place (pagrobėjas)"},
  {t:"a hijacking", d:"the taking control of a public transport vehicle, such as an airliner or train, to use the people aboard as hostages (pagrobimas)"},
  {t:"to deceive / to cheat / to commit fraud", d:"to make someone believe something that is not true (apgauti, sukčiauti)"},
  {t:"a fraudster / a conman", d:"someone who commits the crime of fraud (sukčius, apgavikas)"},
  {t:"a fraud", d:"a deliberate deception intended to secure an unfair or unlawful gain (apgaulė, sukčiavimas)"},
  {t:"to terrorise", d:"to deliberately frighten people by threatening to harm them (terorizuoti)"},
  {t:"a terrorist", d:"a person who uses unlawful violence and intimidation, especially against civilians, in the pursuit of political aims (teroristas)"},
  {t:"a terrorism", d:"the use of violence and intimidation in the pursuit of political aims (teroro aktas)"},
  {t:"to blackmail", d:"to demand money from a person by threatening to tell someone else a secret about them (šantažuoti)"},
  {t:"a blackmailer", d:"a person who is blackmailing (šantažuotojas)"},
  {t:"a blackmail", d:"the crime of demanding money from a person by threatening to tell someone else a secret about them (šantažas)"},
  {t:"to joyride", d:"to ride a car that has been stolen (nuvaryti mašiną)"},
  {t:"a joyrider", d:"a person who drives fast and dangerously for pleasure, especially in a stolen vehicle (vagis, nuvaręs mašiną)"},
  {t:"a joyriding", d:"the crime of stealing a car and driving it in a fast and dangerous way for fun (pasivažinėjimas nuvaryta mašina)"},
  {t:"to traffic drugs", d:"to take drugs to another country or sell them (prekiauti narkotikais)"},
  {t:"a drug trafficker", d:"an unlicensed dealer in illegal drugs (prekiautojas narkotikais)"},
  {t:"a drug trafficking", d:"the buying or selling of drugs (prekyba narkotikais)"},
  {t:"to pick somebody's pocket", d:"to quietly steal something from someone's pocket (pavogti iš kišenės)"},
  {t:"a pickpocket", d:"a thief who steals from the pockets or purses of others in public places (kišenvagis)"},
  {t:"a pickpocketing", d:"the crime of stealing things out of people's pockets or bags, especially in a crowd (kišenvagystė)"},
  {t:"to assassinate", d:"to murder for political reasons (nužudyti, susidoroti)"},
  {t:"an assassin", d:"a person who murders for political reasons or a reward (samdytas žudikas, teroristas)"},
  {t:"an assassination", d:"the murder of an important person (nužudymas, susidorojimas)"},
  {t:"a ransom", d:"payment demanded for the release of a person or property (išpirka)"},
  {t:"petty", d:"small and insignificant (smulkus, mažas)"},
  {t:"minor", d:"small, unimportant (smulkus)"},
  {t:"major", d:"very large or important (didelis, rimtas)"},
  {t:"violent", d:"acting or done with strong, rough force (žiaurus)"},
  {t:"serious", d:"of great consequence (rimtas)"},
  {t:"littering", d:"leaving rubbish in a public place (šiukšlinimas)"},
  {t:"to be sentenced to", d:"to be given a punishment for a crime (būti nuteistam)"},
  {t:"life imprisonment", d:"a prison sentence that (theoretically) keeps people in prison until they die (kalėjimas iki gyvos galvos)"},
  {t:"to fine / a fine", d:"to punish, or a sum of money to be paid to the state by a convicted person as punishment for an offense (nubausti, bauda)"},
  {t:"to send to prison", d:"to arrange for someone to go to a building where people are kept as a punishment for a crime, or while they are waiting to go to court for their trial (pasodinti į kalėjimą, įkalinti)"},
  {t:"to give a suspended sentence", d:"to officially say a punishment that is given by a court, in which a criminal is told they will be sent to prison if they do anything else illegal within the time mentioned (paskirti bausmę atidedant jos vykdymą, paskirti lygtinę bausmę)"},
  {t:"to do community service", d:"to carry out the work that is not paid that someone does to help other people, sometimes as punishment for a crime (atlikti viešuosius darbus)"},
  {t:"to give a warning", d:"to inform a person with a statement telling them that if they continue to behave in an unsatisfactory way, they will be punished (įspėti)"},
  {t:"to break in", d:"force entry to a building (įsiveržti, įsilaužti)"},
  {t:"to break into", d:"to enter somewhere (e.g. a house) illegally, especially by force (įsiveržti)"},
  {t:"to break off", d:"to separate (atlaužti)"},
  {t:"to break out of", d:"to escape from a place by force (pabėgti)"},
  {t:"to break up", d:"to end a relationship (išsiskirti)"},
  {t:"the accused", d:"a person charged with a criminal offence (kaltinamasis)"},
  {t:"the defendant", d:"an individual or group being sued or charged with a crime (ginamasis)"},
  {t:"evidence", d:"proof (įrodymas, įkaltis)"},
  {t:"to convict", d:"to find guilty (nuteisti)"},
  {t:"to arrest", d:"to take charge of you and take you to a police station, because they believe you may have committed a crime (sulaikytas, areštuotas)"},
  {t:"to try", d:"to examine a person accused of committing a crime in a law court by asking them questions and considering known facts, and then decide if they are guilty (teisti, nagrinėti bylą)"},
  {t:"guilty", d:"having done something wrong (kaltas)"},
  {t:"innocent", d:"not guilty of a crime or offense (nekaltas)"},
  {t:"put behind bars", d:"to put in jail (pasodinti į kalėjimą)"},
  {t:"a witness", d:"a person who sees an event, typically a crime or accident, take place (liudininkas)"},
  {t:"a weapon", d:"anything used to cause injury or to kill during an attack, fight or war (ginklas)"},
  {t:"to deny", d:"to say that something is not true (neigti)"},
  {t:"a law", d:"rules made by parliament and enforceable by the courts (įstatymas)"},
  {t:"to praise", d:"to express approval for their achievements or qualities (girti)"},

<script>
/* =========================================================
   DATA
   ========================================================= */
let TERMS = (window.TERMS || []).slice();

/* =========================================================
   STORAGE / STATE
   ========================================================= */
const KEY = "insight5a-crime-v2";
const RAND_DEFAULTS = { learn:true, test:true, match:true, write:true, list:false };
let state = load();

function load(){
  let s = {};
  try{ s = JSON.parse(localStorage.getItem(KEY) || "{}"); }catch(e){ s = {}; }
  s = Object.assign({ starred:[], known:[], bestMatch:null, custom:null }, s);
  s.settings = Object.assign({}, s.settings || {});
  s.settings.random = Object.assign({}, RAND_DEFAULTS, s.settings.random || {});
  return s;
}
let storageOK = true;
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); storageOK = true; }
  catch(e){ storageOK = false; }
}
function storageAvailable(){
  try{ const k = "__storagetest__"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
}
function randOn(m){ return state.settings.random[m] !== false; }
function toggleRand(m){ state.settings.random[m] = !randOn(m); save(); }

const starredSet = () => new Set(state.starred);
const knownSet   = () => new Set(state.known);

function toggleStar(term){
  const s = starredSet();
  const wasStarred = s.has(term);
  wasStarred ? s.delete(term) : s.add(term);
  state.starred = [...s]; save();
  if(mode === "starred" && !starredSet().size) mode = "list";
  render();
  toast(wasStarred ? "Removed from favourites" : "⭐ Starred — saved on this device");
}
function toggleKnown(term){
  const s = knownSet();
  const wasKnown = s.has(term);
  wasKnown ? s.delete(term) : s.add(term);
  state.known = [...s]; save(); render();
  toast(wasKnown ? "Marked as not learned" : "✓ Marked known — saved on this device");
}

/* helpers */
const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const norm = s => String(s).toLowerCase().replace(/^(to |a |an |the )/,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();

let toastTimer=null;
function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove("show"), 1600);
}

/* ---------------------------------------------------------
   Smart distractors: wrong options that mean something similar
   --------------------------------------------------------- */
const STOPWORDS = new Set(("a an the to of in on at for from by with and or is are was were be been being that this it its as you your someone something person people who which what when where how not no other others one two into out up down their they them his her him our us we do does did done make makes making give gives giving take takes taking have has had get gets getting use used using more most very much many some any can could will would should may might must about after before over under again then than there here also especially usually typically etc someone's person's").split(" "));
function stemWord(w){
  w = w.toLowerCase();
  if(w.length > 4){
    if(w.endsWith("ies")) return w.slice(0,-3)+"y";
    if(w.endsWith("ing")) return w.slice(0,-3);
    if(w.endsWith("ed"))  return w.slice(0,-2);
    if(w.endsWith("er"))  return w.slice(0,-2);
    if(w.endsWith("or"))  return w.slice(0,-2);
    if(w.endsWith("ion")) return w.slice(0,-3);
    if(w.endsWith("s"))   return w.slice(0,-1);
  }
  return w;
}
function sigOf(text){
  const clean = String(text).replace(/\([^)]*\)/g, " ");
  return [...new Set(clean.split(/[^A-Za-z]+/).filter(w => w.length > 2 && !STOPWORDS.has(w.toLowerCase())).map(stemWord))];
}
/* [fine-grained group, family, matching rule] — first match wins */
const CATEGORIES = [
  ["arson",     "violent",   /\barson|set fire/],
  ["kidnap",    "violent",   /kidnap|abduct|ransom|hostage/],
  ["hijack",    "violent",   /hijack/],
  ["terror",    "violent",   /terror/],
  ["victim",    "justice",   /\bvictim/],
  ["weapon",    "object",    /\bweapon|to cause injury/],
  ["murder",    "violent",   /murder|assassin|\bkill/],
  ["drugs",     "drugs",     /traffick|narcotic|\bdrugs?\b/],
  ["blackmail", "deception", /blackmail/],
  ["bribery",   "deception", /brib/],
  ["forgery",   "deception", /forg|counterfeit|fake copies/],
  ["fraud",     "deception", /fraud|conman|deceiv|cheat/],
  ["shoplift",  "property",  /shoplift/],
  ["pickpocket","property",  /pickpocket|pick somebody|pockets or purses/],
  ["burglary",  "property",  /burgl/],
  ["mugging",   "property",  /\bmug/],
  ["joyride",   "property",  /joyrid/],
  ["robbery",   "property",  /rob(b|ber|bery)|\brob\b/],
  ["theft",     "property",  /theft|thief|\bsteal|stolen/],
  ["breakverbs","property",  /break (in|into|off|out|up)/],
  ["vandalism", "property",  /vandal|hooligan|damag/],
  ["litter",    "property",  /litter|rubbish/],
  ["punishment","punish",    /imprison|prison|sentence|\bfine|community service|warning|behind bars|do time|punish/],
  ["court",     "justice",   /\bcourt|trial|judge|jury|prosecut|defen[cs]|lawyer|convict|guilty|innocent|accused|defendant|evidence|proof|witness|suspect|charge|arrest|fingerprint|accomplice|perpetrator|investigat|prove|deny/],
  ["police",    "justice",   /police|\breport\b|identify|point out|crime prevention/],
  ["law",       "justice",   /\blaw\b|parliament/],
  ["phrase",    "phrase",    /red-handed|in cold blood|at large|on the alert|either die young/],
  ["traits",    "traits",    /nosy|sensible|plain|watchful/],
  ["degree",    "degree",    /\bpetty\b|\bminor\b|\bmajor\b|\bviolent\b|\bserious\b/],
  ["behaviour", "behaviour", /misbehav|mistreat|disrespect|dishonest|disagree|praise|scrawl|acceptable/],
  ["mind",      "mind",      /reflect|disbelief|make a choice/],
  ["social",    "social",    /council estate|misfortune|hierarchy|identity|rival|revenge|make a living|mentor|struggle to pay/],
  ["prevention","prevent",   /precaution|prevent|security|open invitation|keep an eye|attention|burglar-friendly/],
  ["object",    "object",    /vehicle|possession|property|valuable|rusty/],
  ["general",   "general",   /commit a crime|offence|\bcriminal\b|\bcrime\b/]
];
function classifyText(h){
  for(const [fine, fam, re] of CATEGORIES){ if(re.test(h)) return { fine, fam }; }
  return { fine:"misc", fam:"misc" };
}
let INFO = [];
function buildInfo(){
  INFO = TERMS.map(t => {
    const c = classifyText((t.t + " " + t.d).toLowerCase().replace(/\([^)]*\)/g, " "));
    return { cat:c.fine, fam:c.fam, wt:new Set(sigOf(t.t)), wd:new Set(sigOf(t.d)) };
  });
}
function optionText(i, key){ return key === "t" ? TERMS[i].t : TERMS[i].d; }
function optionScore(a, b, key){
  const A = INFO[a], B = INFO[b];
  if(!A || !B) return Math.random();
  const wa = key === "t" ? A.wt : A.wd, wb = key === "t" ? B.wt : B.wd;
  let s = 0;
  if(A.cat === B.cat) s += 6; else if(A.fam === B.fam) s += 3;
  let ov = 0; wb.forEach(w => { if(wa.has(w)) ov++; });
  s += 2 * Math.min(ov, 4);
  if(optionText(a,key).split(" ")[0].toLowerCase() === optionText(b,key).split(" ")[0].toLowerCase()) s += 1;
  return s + Math.random() * 0.9;      // small random tie-break so options vary
}
function sameMeaning(a, b){
  const strip = s => String(s).replace(/\([^)]*\)/g, " ");   // ignore the Lithuanian in brackets
  const A = norm(strip(a)), B = norm(strip(b));
  if(A === B) return true;
  const toks = s => [...new Set(s.split(" ").filter(w => w.length > 1))];
  const ta = toks(A), tb = toks(B);
  if(ta.slice().sort().join(" ") === tb.slice().sort().join(" ")) return true;   // same words, different order
  if(ta.length >= 4 && tb.length >= 4){                                          // long text = usually a definition
    const sa = new Set(ta), sb = new Set(tb);
    if(ta.every(w => sb.has(w)) || tb.every(w => sa.has(w))) return true;        // one is a near-copy of the other
  }
  return false;
}
function topSimilar(correctIdx, key, n){
  const correctText = optionText(correctIdx, key);
  return TERMS.map((_, i) => i)
    .filter(i => i !== correctIdx && !sameMeaning(optionText(i, key), correctText))
    .map(i => ({ i, s: optionScore(correctIdx, i, key) }))
    .sort((x, y) => y.s - x.s)
    .slice(0, Math.max(n, 1))
    .map(o => o.i);
}
function pickOptions(correctIdx, key, n){
  const correctText = optionText(correctIdx, key);
  const scored = TERMS.map((_, i) => i)
    .filter(i => i !== correctIdx && !sameMeaning(optionText(i, key), correctText))
    .map(i => ({ i, s: optionScore(correctIdx, i, key) }))
    .sort((x, y) => y.s - x.s);
  const A = INFO[correctIdx] || {};
  let pool = scored.filter(o => INFO[o.i] && INFO[o.i].cat === A.cat);                    // same exact group
  if(pool.length < n) pool = scored.filter(o => INFO[o.i] && INFO[o.i].fam === A.fam);    // same broad family
  if(pool.length < n) pool = scored;                                                     // last resort
  const chosen = shuffle(pool.slice(0, Math.max(n + 3, 6))).map(o => o.i).slice(0, n);   // shuffle for variety
  return shuffle([correctIdx, ...chosen]);
}

/* ---------------------------------------------------------
   Audio: prefer the most natural/neural voice available
   --------------------------------------------------------- */
let cachedVoice = null;
function scoreVoice(v){
  const n = (v.name||"").toLowerCase(), l = (v.lang||"").toLowerCase();
  let sc = 0;
  if(/natural|neural|online|premium|enhanced|multilingual/.test(n)) sc += 200;
  if(/google/.test(n)) sc += 120;
  if(/aria|jenny|libby|sonia|guy|samantha|serena|daniel|kate|ryan|allison|emma|brian|ava/.test(n)) sc += 80;
  if(l.startsWith("en-gb")) sc += 40;
  else if(l.startsWith("en-us")) sc += 30;
  else if(l.startsWith("en-au") || l.startsWith("en-ie")) sc += 20;
  else if(l.startsWith("en")) sc += 10;
  else sc -= 1000;
  return sc;
}
function bestVoice(){
  const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  if(!vs.length) return null;
  return vs.slice().sort((a,b)=>scoreVoice(b)-scoreVoice(a))[0];
}
function speak(text){
  try{
    if(!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/^(to |a |an |the )/i,""));
    const v = cachedVoice || (cachedVoice = bestVoice());
    if(v){ u.voice = v; }
    u.lang = (v && v.lang) ? v.lang : "en-GB";
    u.rate = 0.95; u.pitch = 1.0; u.volume = 1.0;
    speechSynthesis.speak(u);
  }catch(e){}
}
if("speechSynthesis" in window){
  speechSynthesis.onvoiceschanged = () => { cachedVoice = null; };
  speechSynthesis.getVoices();
}

/* ---------------------------------------------------------
   Sound effects + visual feedback
   --------------------------------------------------------- */
let actx = null;
function ensureAudio(){
  try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; }
  return actx;
}
function tone(freq, dur, type, vol, delay){
  const a = ensureAudio(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  const t = a.currentTime + (delay||0);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.03);
}
function sndWrong(){ tone(170,0.20,"sawtooth",0.05); tone(115,0.24,"sawtooth",0.04,0.05); }
function sndPick(){ tone(520,0.06,"sine",0.035); }
function sndRight(){ tone(880,0.10,"sine",0.05); tone(1320,0.13,"sine",0.04,0.07); }

function effectWrong(){
  const panel = document.querySelector("#view .panel");
  if(panel){ panel.classList.add("shake-it"); setTimeout(()=>panel.classList.remove("shake-it"), 440); }
  const o = document.createElement("div"); o.className = "flashbad"; document.body.appendChild(o);
  setTimeout(()=>o.remove(), 620); sndWrong();
}
function effectRight(){
  const o = document.createElement("div"); o.className = "flashgood"; document.body.appendChild(o);
  setTimeout(()=>o.remove(), 480); sndRight();
}

/* =========================================================
   ROUTER + TABS (Starred tab appears only when you have stars)
   ========================================================= */
const BASE_TABS = [
  {mode:"flash", label:"Flashcards", ic:"🃏"},
  {mode:"learn", label:"Learn",      ic:"🧠"},
  {mode:"test",  label:"Test",       ic:"📝"},

  {mode:"write", label:"Write",      ic:"⌨️"},
  {mode:"list",  label:"List",       ic:"📋"}
];
let mode = "flash";
function updateTabs(){
  const nav = $("#tabs"); const n = starredSet().size;
  let html = BASE_TABS.map(t =>
    `<button class="tab ${mode===t.mode?'active':''}" data-mode="${t.mode}"><span class="ic">${t.ic}</span>${t.label}</button>`).join("");
  if(n){
    html += `<button class="tab ${mode==='starred'?'active':''}" data-mode="starred">
      <span class="ic">⭐</span>Starred<span class="badge-dot">${n}</span></button>`;
  }
  nav.innerHTML = html;
  nav.querySelectorAll(".tab").forEach(b => b.addEventListener("click", ()=>setMode(b.dataset.mode)));
}
function setMode(m){
  if(m === "starred" && !starredSet().size) m = "list";

  render();
}
function render(){
  $("#countPill").textContent = TERMS.length + " terms";
  const pPill = $("#progressPill");
  if(pPill) pPill.textContent = "⭐ " + starredSet().size + " · ✓ " + knownSet().size;
  if(mode === "starred" && !starredSet().size) mode = "list";
  updateTabs();
  const view = $("#view");
  if(!TERMS.length){ view.innerHTML = emptyHTML(); return; }
  const R = {flash:renderFlash, learn:renderLearn, test:renderTest, match:renderMatch, write:renderWrite, list:renderList, starred:renderStarred}[mode];
  view.innerHTML = R();
  ({flash:bindFlash, learn:bindLearn, test:bindTest, match:bindMatch, write:bindWrite, list:bindList, starred:bindStarred}[mode])();
}
function emptyHTML(){
  return `<div class="panel center"><h2>No words yet</h2>
  <p class="hint">Add words in <code>terms.js</code> to get started.</p></div>`;
}

/* =========================================================
   FLASHCARDS
   ========================================================= */
let flash = { order:[], i:0, flipped:false, termFirst:true, shuffled:false, starredOnly:false };
function flashPool(){
  let pool = TERMS.map((_,i)=>i);
  if(flash.starredOnly){ const s = starredSet(); pool = pool.filter(i => s.has(TERMS[i].t)); }
  return flash.shuffled ? shuffle(pool) : pool;
}
function renderFlash(){
  if(!flash.order.length || flash.order.length !== flashPool().length) flash.order = flashPool();
  if(flash.i >= flash.order.length) flash.i = 0;
  if(!flash.order.length){
    return `<div class="panel center"><h2>No starred words</h2>
      <p class="hint">Turn off “Starred only” or star some words first.</p></div>`;
  }
  const term = TERMS[flash.order[flash.i]];
  const s = starredSet();
  const front = flash.termFirst ? term.t : term.d;
  const back  = flash.termFirst ? term.d : term.t;
  const backEx = flash.termFirst ? (term.e?`<div class="ex">💬 ${esc(term.e)}</div>`:"") : "";
  const done = flash.i+1, total = flash.order.length;
  const pct = total ? (done/total*100) : 0;
  const isStar = s.has(term.t);
  const isKnown = knownSet().has(term.t);
  return `
  <div class="panel">
    <div class="row spread">
      <div class="row">
        <button class="chip ${flash.termFirst?'on':''}" id="sideToggle">${flash.termFirst?'Term → Definition':'Definition → Term'}</button>
        <button class="chip ${flash.shuffled?'on':''}" id="shuffleToggle">🔀 Shuffle</button>
        <button class="chip ${flash.starredOnly?'on':''}" id="starOnly">⭐ Starred only</button>
      </div>
      <div class="hint">Click the card to flip</div>
    </div>

    <div class="cardstage">
      <div class="flipcard ${flash.flipped?'flipped':''}" id="flipcard">
        <div class="face front">
          <button class="star" id="starBtn" title="Star this word">${isStar?'⭐':'☆'}</button>
          <button class="speak" id="speakFront" title="Pronounce">🔊</button>
          <div class="kind">${flash.termFirst?'Term':'Definition'}</div>
          <div class="big">${esc(front)}</div>
        </div>
        <div class="face back">
          <button class="speak" id="speakBack" title="Pronounce">🔊</button>
          <div class="kind">${flash.termFirst?'Definition':'Term'}</div>
          <div class="big">${esc(back)}</div>
          ${backEx}

function bindFlash(){
  const card = $("#flipcard");
  const flip = ()=>{ flash.flipped = !flash.flipped; card.classList.toggle("flipped", flash.flipped); };
  card.addEventListener("click", flip);
  $("#flipBtn").addEventListener("click", e=>{e.stopPropagation(); flip();});
  $("#starBtn").addEventListener("click", e=>{e.stopPropagation(); toggleStar(TERMS[flash.order[flash.i]].t);});
  $("#knownBtn").addEventListener("click", e=>{e.stopPropagation(); toggleKnown(TERMS[flash.order[flash.i]].t);});
  $("#speakFront").addEventListener("click", e=>{e.stopPropagation(); const t=TERMS[flash.order[flash.i]]; speak(flash.termFirst?t.t:t.d);});
  $("#speakBack").addEventListener("click", e=>{e.stopPropagation(); const t=TERMS[flash.order[flash.i]]; speak(flash.termFirst?t.d:t.t);});
  const move = d => { flash.i = (flash.i + d + flash.order.length) % flash.order.length; flash.flipped=false; render(); };
  $("#prevBtn").addEventListener("click", ()=>move(-1));
  $("#nextBtn").addEventListener("click", ()=>move(1));
  $("#sideToggle").addEventListener("click", ()=>{ flash.termFirst=!flash.termFirst; flash.flipped=false; render(); });
  $("#shuffleToggle").addEventListener("click", ()=>{ flash.shuffled=!flash.shuffled; flash.i=0; flash.order=flashPool(); flash.flipped=false; render(); });
  $("#starOnly").addEventListener("click", ()=>{ flash.starredOnly=!flash.starredOnly; flash.i=0; flash.order=flashPool(); flash.flipped=false; render(); });

  document.addEventListener("keydown", flashKeys);
}
function flashKeys(e){
  if(mode!=="flash"){ document.removeEventListener("keydown", flashKeys); return; }
  if(["INPUT","TEXTAREA"].includes(document.activeElement.tagName)) return;
  if(e.code==="Space"){ e.preventDefault(); if($("#flipBtn")) $("#flipBtn").click(); }
  if(e.code==="ArrowRight" && $("#nextBtn")) $("#nextBtn").click();
  if(e.code==="ArrowLeft" && $("#prevBtn")) $("#prevBtn").click();
}

/* =========================================================
   LEARN
   ========================================================= */
let learn = null;
function buildLearn(){
  learn = { order: randOn("learn") ? shuffle(TERMS.map((_,i)=>i)) : TERMS.map((_,i)=>i),
            scores:{}, current:null, options:[], askTerm:true, written:false, answered:false, total:TERMS.length };
  nextLearnQ();
}
function masteredCount(){ return Object.values(learn.scores).filter(v=>v>=2).length; }
function nextLearnQ(){
  learn.answered = false; learn.current = null; learn.options = [];
  let pool = TERMS.map((_,i)=>i).filter(i => (learn.scores[i]||0) < 2);
  if(!pool.length){ learn.current = null; return; }
  // "randomise" = pick any unmastered at random; off = follow the saved order
  let idx;
  if(randOn("learn")){ idx = pool[Math.floor(Math.random()*pool.length)]; }
  else { idx = learn.order.find(i => pool.includes(i)); if(idx===undefined) idx = pool[0]; }
  learn.current = idx;
  learn.askTerm = randOn("learn") ? Math.random() < 0.5 : (learn.order.indexOf(idx) % 2 === 0);
  const key = learn.askTerm ? "t" : "d";
  learn.options = pickOptions(idx, key, 3);   // wrong options now mean something similar
  learn.written = (learn.scores[idx]||0) >= 1;
}
function renderLearn(){
  if(!learn) buildLearn();
  const done = masteredCount();
  const pct = learn.total ? done/learn.total*100 : 0;
  if(learn.current===null){
    return `<div class="panel center">
      <div style="font-size:3rem">🎉</div>
      <h2>All words mastered!</h2>
      <p class="hint">You answered every word correctly twice. Nothing is locked — go again anytime.</p>
      <button class="btn primary mt" id="restartLearn">Study again</button>
      <div class="progress mt"><i style="width:100%"></i></div>
    </div>`;
  }
  const term = TERMS[learn.current];
  const prompt = learn.askTerm ? term.d : term.t;
  const promptLabel = learn.askTerm ? "Which term matches this definition?" : "Which definition matches this term?";
  let body;
  if(learn.written){
    body = `<div class="hint">Type the ${learn.askTerm?'term':'definition'}…</div>
      <input class="input" id="learnInput" placeholder="Type your answer…" autocomplete="off">
      <div class="row"><button class="btn primary" id="learnCheck">Check</button>
      <button class="btn ghost" id="learnSkip">Don't know</button></div>
      <div class="feedback" id="learnFb"></div>`;
  } else {
    body = `<div class="row" id="learnOpts" style="display:grid;gap:10px">
        ${learn.options.map(i=>`<button class="opt" data-i="${i}">${esc(learn.askTerm?TERMS[i].t:TERMS[i].d)}</button>`).join("")}
      </div>
      <div class="feedback" id="learnFb"></div>`;
  }
  return `<div class="panel">
    <div class="row spread">
      <h2>Learn</h2>
      <button class="chip ${randOn('learn')?'on':''}" id="randToggle">🔀 Randomise</button>
    </div>
    <div class="progress mt"><i style="width:${pct}%"></i></div>
    <div class="meta"><span>${done} / ${learn.total} mastered (2 correct each)</span><span>${learn.askTerm?'Definition → Term':'Term → Definition'}</span></div>
    <div class="qbox mt">
      <div class="hint">${promptLabel}</div>
      <div class="qtext">${esc(prompt)}</div>
      ${body}
    </div>
  </div>`;
}
function learnGrade(correct){
  if(learn.answered) return;              // lock: no second answer, no second Next button
  learn.answered = true;
  const fb = $("#learnFb"); if(!fb) return;
  const term = TERMS[learn.current];
  if(correct) learn.scores[learn.current] = (learn.scores[learn.current]||0)+1;
  else learn.scores[learn.current] = Math.max(0, (learn.scores[learn.current]||0)-1);

  fb.className = "feedback show " + (correct?"good":"bad");
  fb.innerHTML = (correct?"✓ Correct! ":"✗ ") + `Answer: <b>${esc(learn.askTerm?term.t:term.d)}</b>` +
     (term.e?`<div class="hint" style="font-weight:400;margin-top:6px">💬 ${esc(term.e)}</div>`:"");
  correct ? effectRight() : effectWrong();

  document.querySelectorAll("#learnOpts .opt").forEach(b=>b.disabled=true);
  ["#learnInput","#learnCheck","#learnSkip"].forEach(s=>{ const el=$(s); if(el) el.disabled=true; });

  const next = document.createElement("button");
  next.className = "btn primary mt";
  next.textContent = masteredCount() >= learn.total ? "Finish" : "Next →";
  next.addEventListener("click", ()=>{ nextLearnQ(); render(); });
  fb.after(next);
}
function bindLearn(){
  if(learn && learn.current===null){ $("#restartLearn").addEventListener("click", ()=>{ buildLearn(); render(); }); return; }
  if(!learn) return;
  $("#randToggle").addEventListener("click", ()=>{ toggleRand("learn"); render(); });
  if(learn.written){
    const inp = $("#learnInput");
    if(inp){ inp.focus(); inp.addEventListener("keydown", e=>{ if(e.key==="Enter") $("#learnCheck").click(); }); }
    const check = ()=>{
      if(learn.answered) return;
      const val = norm(inp.value);
      const target = norm(learn.askTerm ? TERMS[learn.current].t : TERMS[learn.current].d);
      learnGrade(val.length>0 && (val===target || (target.includes(val) && val.length>=target.length-4)));
    };
    $("#learnCheck").addEventListener("click", check);
    $("#learnSkip").addEventListener("click", ()=>learnGrade(false));
  } else {
    document.querySelectorAll("#learnOpts .opt").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        if(learn.answered) return;        // extra guard
        const chosen = +btn.dataset.i, correct = chosen === learn.current;
        document.querySelectorAll("#learnOpts .opt").forEach(b=>{
          if(+b.dataset.i===learn.current) b.classList.add("correct");
          else if(+b.dataset.i===chosen) b.classList.add("wrong");
          b.disabled = true;
        });
        learnGrade(correct);
      });
    });
  }
}

let test = null;
function renderTest(){

function testConfigHTML(){

function bindTest(){

function startTest(){
  const nChip = document.querySelector("#testCount .chip.on");
  const n = nChip ? +nChip.dataset.n : 10;
  const types = [...document.querySelectorAll("#testTypes .chip.on")].map(c=>c.dataset.type);
  const side = document.querySelector("#testSide .chip.on").dataset.side;
  if(!types.length){ toast("Pick at least one question type"); return; }
  let pool = TERMS.map((_,i)=>i);
  if(randOn("test")) pool = shuffle(pool);
  if(n>0) pool = pool.slice(0,n);
  const qs = pool.map(idx => makeQuestion(idx, types, side));
  test = { qs, i:0, correct:0, finished:false, cancelled:false, answers:[], locked:false };
  render();
}
function makeQuestion(idx, types, side){
  const type = types[Math.floor(Math.random()*types.length)];
  const term = TERMS[idx];
  if(type==="written"){
    const askTerm = side==="term";
    return { idx, kind:"written", askTerm, prompt: askTerm? term.d : term.t, answer: askTerm? term.t : term.d };
  }
  if(type==="tf"){
    const askTerm = side==="term";
    let mixIdx = idx, isFalse = false;
    if(Math.random() < 0.5){
      const near = topSimilar(idx, askTerm ? "d" : "t", 8);   // plausible-looking mix-up
      if(near.length){ mixIdx = near[Math.floor(Math.random()*near.length)]; isFalse = true; }
    }
    const statement = askTerm ? `${term.t} — ${TERMS[mixIdx].d}` : `${TERMS[mixIdx].t} — ${term.d}`;
    return { idx, kind:"tf", prompt:statement, answer: isFalse ? "False" : "True" };
  }
  const askTerm = (type==="def2term");
  const key = askTerm ? "t" : "d";
  return { idx, kind:"mc", askTerm, prompt: askTerm? term.d : term.t, answer: term[key],
           options: pickOptions(idx, key, 3), optionKey: key };
}
function testQuestionHTML(){
  const q = test.qs[test.i];
  const pct = (test.i/test.qs.length)*100;
  let body = "";
  if(q.kind==="mc"){
    body = `<div class="row" id="testOpts" style="display:grid;gap:10px">
      ${q.options.map(i=>`<button class="opt" data-val="${esc(TERMS[i][q.optionKey])}">${esc(TERMS[i][q.optionKey])}</button>`).join("")}
    </div>`;
  } else if(q.kind==="written"){
    body = `<input class="input" id="testInput" placeholder="Type your answer…" autocomplete="off">
            <div class="row"><button class="btn primary" id="testSubmit">Submit</button></div>`;
  } else {
    body = `<div class="tfrow">
      <button class="btn" data-val="True" id="tfTrue" style="flex:1">True</button>
      <button class="btn" data-val="False" id="tfFalse" style="flex:1">False</button>
    </div>`;
  }
  const label = q.kind==="tf" ? "True or false?" : (q.kind==="written" ? "Write the answer" : "Choose the correct answer");
  return `<div class="panel">
    <div class="row spread">
      <div class="row">
        <button class="btn ghost" id="cancelTest">Cancel test</button>
        <span class="hint">${test.correct} correct so far</span>
      </div>
      <span class="hint">Question ${test.i+1} / ${test.qs.length}</span>
    </div>
    <div class="progress mt"><i style="width:${pct}%"></i></div>
    <div class="qbox mt">
      <div class="hint">${label}</div>
      <div class="qtext">${esc(q.prompt)}</div>
      ${body}
      <div class="feedback" id="testFb"></div>
    </div>
  </div>`;
}
function bindTestQuestion(){
  const q = test.qs[test.i];
  test.locked = false;
  $("#cancelTest").addEventListener("click", ()=>{
    test.cancelled = true; test.finished = true; render();
  });
  const finishQ = (given, isCorrect) => {
    if(test.locked) return;                 // lock: one answer per question
    test.locked = true;
    const fb = $("#testFb");
    fb.className = "feedback show " + (isCorrect?"good":"bad");
    fb.innerHTML = (isCorrect?"✓ Correct! ":"✗ ") + `Answer: <b>${esc(q.answer)}</b>`;
    isCorrect ? effectRight() : effectWrong();
    test.answers.push({ q, given, isCorrect });
    if(isCorrect) test.correct++;
    document.querySelectorAll("#testOpts .opt").forEach(b=>b.disabled=true);
    ["#testInput","#testSubmit","#tfTrue","#tfFalse"].forEach(s=>{ const el=$(s); if(el) el.disabled=true; });
    const next = document.createElement("button");
    next.className = "btn primary mt";
    next.textContent = (test.i === test.qs.length-1) ? "See results" : "Next →";
    next.addEventListener("click", ()=>{
      if(test.i === test.qs.length-1) test.finished = true; else test.i++;
      render();
    });
    fb.after(next);
  };
  if(q.kind==="mc"){
    document.querySelectorAll("#testOpts .opt").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        if(test.locked) return;
        const correct = norm(btn.dataset.val) === norm(q.answer);
        btn.classList.add(correct?"correct":"wrong");
        document.querySelectorAll("#testOpts .opt").forEach(b=>{
          if(norm(b.dataset.val)===norm(q.answer)) b.classList.add("correct");
          b.disabled = true;
        });
        finishQ(btn.dataset.val, correct);
      });
    });
  } else if(q.kind==="written"){
    const inp = $("#testInput"); if(inp) inp.focus();
    const submit = ()=>{
      if(test.locked) return;
      const val = inp.value;
      finishQ(val, norm(val) === norm(q.answer));
    };
    $("#testSubmit").addEventListener("click", submit);
    if(inp) inp.addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); });
  } else {
    ["#tfTrue","#tfFalse"].forEach(sel=>{
      const b = $(sel); if(!b) return;
      b.addEventListener("click", ()=>{
        if(test.locked) return;
        const correct = b.dataset.val === q.answer;
        b.classList.add(correct?"ok":"danger");
        finishQ(b.dataset.val, correct);
      });
    });
  }
}
function testResultsHTML(){
  const answered = test.answers.length;
  const pct = answered ? Math.round(test.correct/answered*100) : 0;
  const grade = pct>=90?"A":pct>=80?"B":pct>=70?"C":pct>=60?"D":"F";
  const wrong = test.answers.filter(a=>!a.isCorrect);
  return `<div class="panel">
    <div class="center">
      <h2>${test.cancelled ? "Test cancelled" : "Results"}</h2>
      ${answered ? `
        <div class="bigscore" style="color:${pct>=70?'var(--ok)':'var(--bad)'}">${pct}%</div>
        <p class="hint">Grade ${grade} · ${test.correct} of ${answered} correct</p>`

      <div class="row" style="justify-content:center">

      </tbody></table>`:``}

let match = null, matchTick = null;
function renderMatch(){
  if(!match) return matchIntroHTML();

  return `<div class="panel">

      <div class="row">
        <button class="chip ${randOn('match')?'on':''}" id="randToggle">🔀 Randomise</button>

      </div>
    </div>
    <p class="hint">Tap a word, then its meaning. Match all ${match.pairs} pairs as fast as you can.</p>
    <div class="progress mt"><i style="width:${pct}%"></i></div>
    <div class="meta"><span>${match.matched} / ${match.pairs} pairs</span>
      <span>${state.bestMatch?('Best: '+state.bestMatch.toFixed(1)+'s'):'No best time yet'}</span></div>
    <div class="matchgrid mt">
      ${match.tiles.map(tl=>`<button class="tile ${tl.done?'done':''} ${tl.sel?'sel':''}" data-id="${tl.id}" data-side="${tl.side}">${esc(tl.text)}</button>`).join("")}
    </div>
    <button class="btn ghost mt" id="matchRestart">Restart</button>
  </div>`;
}
function matchIntroHTML(){
  return `<div class="panel center">
    <h2>Match</h2>
    <p class="hint">Match words with their meanings. Unlimited plays — beat your best time.</p>
    ${state.bestMatch?`<p><span class="pill" style="background:var(--soft);color:var(--ink)">Best time: ${state.bestMatch.toFixed(1)}s</span></p>`:""}
    <button class="btn primary" id="matchStart">Play</button>
  </div>`;
}
function newMatch(){
  const n = Math.min(6, TERMS.length);
  let idxs = TERMS.map((_,i)=>i);
  if(randOn("match")) idxs = shuffle(idxs);
  idxs = idxs.slice(0,n);
  const tiles = [];
  idxs.forEach((i,k)=>{
    tiles.push({id:k, side:"t", text:TERMS[i].t, done:false, sel:false});
    tiles.push({id:k, side:"d", text:TERMS[i].d, done:false, sel:false});
  });
  match = { pairs:n, tiles: shuffle(tiles), sel:null, matched:0, start:Date.now(), done:false, busy:false };
}
function tileEl(id, side){ return document.querySelector('.tile[data-id="' + id + '"][data-side="' + side + '"]'); }
function updateMatchProgress(){
  const pct = (match.matched/match.pairs)*100;
  const bar = document.querySelector("#view .progress > i"); if(bar) bar.style.width = pct + "%";
  const meta = document.querySelector("#view .meta span"); if(meta) meta.textContent = match.matched + " / " + match.pairs + " pairs";
}
function finishMatch(){
  const t = (Date.now()-match.start)/1000;
  match.done = true; match.time = t;
  if(state.bestMatch===null || t < state.bestMatch){ state.bestMatch = t; save(); }
  clearInterval(matchTick);
  setTimeout(()=>{ if(match && match.done) render(); }, 280);
}
function bindMatch(){
  if(!match){ $("#matchStart").addEventListener("click", ()=>{ newMatch(); render(); }); return; }
  $("#matchRestart").addEventListener("click", ()=>{ newMatch(); render(); });   // works while playing AND when finished
  if(match.done) return;
  $("#randToggle").addEventListener("click", ()=>{ toggleRand("match"); newMatch(); render(); });
  document.querySelectorAll(".tile").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(btn.classList.contains("done") || match.busy || match.done) return;
      const id = +btn.dataset.id, side = btn.dataset.side;

      // first pick -> show it as selected
      if(!match.sel){
        match.sel = {id, side};
        btn.classList.add("sel");
        sndPick();
        return;
      }
      // tapping the same tile again -> clear the selection
      if(match.sel.id===id && match.sel.side===side){
        btn.classList.remove("sel");
        match.sel = null;
        return;
      }
      // matching pair
      if(match.sel.id===id){
        const first = tileEl(match.sel.id, match.sel.side);
        [first, btn].forEach(t=>{ if(t){ t.classList.remove("sel"); t.classList.add("done","hit"); } });
        match.matched++; match.sel = null;
        updateMatchProgress(); effectRight();
        if(match.matched===match.pairs) finishMatch();
        return;
      }
      // wrong pair -> show the second pick, then fade the selection out
      const first = tileEl(match.sel.id, match.sel.side);
      btn.classList.add("sel");
      match.busy = true;
      requestAnimationFrame(()=>{
        [first, btn].forEach(t=>{ if(t) t.classList.add("wrong"); });
        sndWrong();
      });
      setTimeout(()=>{
        [first, btn].forEach(t=>{ if(t) t.classList.remove("sel","wrong"); });
        match.sel = null; match.busy = false;
      }, 640);
    });
  });
  clearInterval(matchTick);
  matchTick = setInterval(()=>{
    const el = document.querySelector(".timer");
    if(el && match && !match.done) el.textContent = "⏱ " + ((Date.now()-match.start)/1000).toFixed(1) + "s";
    else clearInterval(matchTick);
  }, 100);
}
function matchDoneHTML(){
  return `<div class="panel center">
    <div style="font-size:3rem">🏆</div>
    <h2>All matched!</h2>
    <p class="hint">Your time</p>
    <div class="bigscore">${match.time.toFixed(1)}s</div>
    <p class="hint">${state.bestMatch && match.time>=state.bestMatch ? "Best: "+state.bestMatch.toFixed(1)+"s" : "🏅 New best time!"}</p>
    <button class="btn primary" id="matchRestart">Play again</button>
  </div>`;
}

function renderWrite(){

  if(write.i >= write.order.length){
    return `<div class="panel center">
      <div style="font-size:3rem">✍️</div>
      <h2>Round complete</h2>
      <p class="hint">${write.score} / ${write.order.length} correct</p>
      <button class="btn primary" id="writeRestart">Go again</button>
    </div>`;
  }
  const term = TERMS[write.order[write.i]];
  const pct = write.i/write.order.length*100;
  return `<div class="panel">
    <div class="row spread">
      <h2>Write</h2>
      <div class="row">
        <button class="chip ${randOn('write')?'on':''}" id="randToggle">🔀 Randomise</button>
        <span class="hint">streak: ${write.streak} 🔥</span>
      </div>
    </div>
    <div class="progress mt"><i style="width:${pct}%"></i></div>
    <div class="meta"><span>${write.i} / ${write.order.length}</span><span>${write.score} correct</span></div>
    <div class="qbox mt">
      <div class="hint">Type the word or phrase that matches this definition</div>
      <div class="qtext">${esc(term.d)}</div>
      <input class="input" id="writeInput" placeholder="Type the term…" autocomplete="off">
      <div class="row"><button class="btn primary" id="writeCheck">Check</button>
      <button class="btn ghost" id="writeSkip">Skip</button></div>
      <div class="feedback" id="writeFb"></div>
    </div>
  </div>`;
}
function bindWrite(){
  if(!write) buildWrite();
  if(write.i >= write.order.length){ $("#writeRestart").addEventListener("click", ()=>{ write=null; render(); }); return; }
  $("#randToggle").addEventListener("click", ()=>{ toggleRand("write"); const keep=write.i; buildWrite(); write.i=Math.min(keep, write.order.length); render(); });
  const term = TERMS[write.order[write.i]];
  const inp = $("#writeInput"); if(inp) inp.focus();
  const check = ()=>{
    if(write.answered) return;
    write.answered = true;
    const val = inp.value;
    const ok = norm(val) === norm(term.t);
    const fb = $("#writeFb");
    fb.className = "feedback show " + (ok?"good":"bad");
    fb.innerHTML = (ok?"✓ Correct! ":"✗ ")+`Answer: <b>${esc(term.t)}</b>`+
      (term.e?`<div class="hint" style="font-weight:400;margin-top:6px">💬 ${esc(term.e)}</div>`:"");
    ok ? effectRight() : effectWrong();
    if(ok){ write.score++; write.streak++; } else { write.streak = 0; }
    inp.disabled = true; $("#writeCheck").disabled = true; $("#writeSkip").disabled = true;
    const next = document.createElement("button");
    next.className="btn primary mt"; next.textContent = write.i===write.order.length-1?"Finish":"Next →";
    next.addEventListener("click", ()=>{ write.i++; write.answered=false; render(); });
    fb.after(next);
  };
  $("#writeCheck").addEventListener("click", check);
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter") check(); });
  $("#writeSkip").addEventListener("click", ()=>{ if(write.answered) return; write.streak = 0; write.i++; write.answered=false; render(); });
}

/* =========================================================
   LIST (with sorting / filtering)
   ========================================================= */
let listFilter = "all", listOrder = null;
function listIndices(){
  if(!randOn("list")) return TERMS.map((_,i)=>i);
  if(!listOrder || listOrder.length !== TERMS.length) listOrder = shuffle(TERMS.map((_,i)=>i));
  return listOrder;
}
function renderList(){
  const s = starredSet(), k = knownSet();
  const filters = [
    {id:"all",      label:"All"},
    {id:"learned",  label:"✓ Learned"},
    {id:"unlearned",label:"⬜ Not learned"},
    {id:"starred",  label:"⭐ Starred"}
  ];
  let idxs = listIndices();
  if(listFilter==="learned")   idxs = idxs.filter(i=>k.has(TERMS[i].t));
  if(listFilter==="unlearned") idxs = idxs.filter(i=>!k.has(TERMS[i].t));
  if(listFilter==="starred")   idxs = idxs.filter(i=>s.has(TERMS[i].t));
  return `<div class="panel">
    <div class="row spread">
      <h2>All ${TERMS.length} terms</h2>
      <button class="chip ${randOn('list')?'on':''}" id="randToggle">🔀 Randomise</button>
    </div>
    <div class="row mt" style="gap:8px">
      ${filters.map(f=>`<button class="chip ${listFilter===f.id?'on':''}" data-filter="${f.id}">
        ${f.label}${f.id==='starred'?` (${s.size})`:''}${f.id==='learned'?` (${k.size})`:''}</button>`).join("")}
    </div>
    <p class="hint mt">Showing ${idxs.length} ${idxs.length===1?'term':'terms'}.</p>
    <table class="mt">
      <thead><tr><th style="width:34%">Term</th><th>Definition</th><th style="width:78px">★ / ✓</th></tr></thead>
      <tbody>
      ${idxs.map(i=>{ const t=TERMS[i]; return `<tr>
        <td class="t">${esc(t.t)}${t.e?`<div class="d" style="font-weight:400">💬 ${esc(t.e)}</div>`:""}</td>
        <td class="d">${esc(t.d)}</td>
        <td style="white-space:nowrap">
          <button class="star" data-star="${esc(t.t)}" style="position:static" title="Star">${s.has(t.t)?'⭐':'☆'}</button>
          <button class="btn ghost" data-known="${esc(t.t)}" style="padding:2px 6px" title="Known">${k.has(t.t)?'✅':'⬜'}</button>
        </td>
      </tr>`; }).join("")}
      </tbody>
    </table>
  </div>`;
}
function bindList(){
  $("#randToggle").addEventListener("click", ()=>{ toggleRand("list"); listOrder = shuffle(TERMS.map((_,i)=>i)); render(); });
  document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click", ()=>{ listFilter = b.dataset.filter; render(); }));
  document.querySelectorAll("[data-star]").forEach(b=>b.addEventListener("click", ()=>toggleStar(b.dataset.star)));
  document.querySelectorAll("[data-known]").forEach(b=>b.addEventListener("click", ()=>toggleKnown(b.dataset.known)));
}

/* =========================================================
   STARRED (appears next to List when you have favourites)
   ========================================================= */
function renderStarred(){
  const s = starredSet();
  const terms = TERMS.filter(t=>s.has(t.t));
  if(!terms.length){
    return `<div class="panel center"><h2>No starred words</h2>
      <p class="hint">Tap ☆ on a flashcard or in the List to add favourites here.</p></div>`;
  }
  return `<div class="panel">
    <h2>⭐ Starred words (${terms.length})</h2>
    <p class="hint">Your favourites. Tap “Remove” to take one out.</p>
    ${terms.map(t=>`<div class="starrow">
      <div class="txt">
        <div class="t">${esc(t.t)}</div>
        <div class="d">${esc(t.d)}</div>
        ${t.e?`<div class="d">💬 ${esc(t.e)}</div>`:""}
      </div>
      <div class="row" style="flex-wrap:nowrap">
        <button class="btn ghost" data-speak="${esc(t.t)}" title="Pronounce">🔊</button>
        <button class="btn danger" data-unstar="${esc(t.t)}">Remove</button>
      </div>
    </div>`).join("")}
  </div>`;
}
function bindStarred(){
  document.querySelectorAll("[data-unstar]").forEach(b=>b.addEventListener("click", ()=>toggleStar(b.dataset.unstar)));
  document.querySelectorAll("[data-speak]").forEach(b=>b.addEventListener("click", ()=>speak(b.dataset.speak)));
}

/* =========================================================
   INIT
   ========================================================= */
if(state.custom && Array.isArray(state.custom) && state.custom.length){
  TERMS = state.custom.map(x=>({t:x.t, d:x.d, e:x.e||""}));
}
buildInfo();
render();
if(!storageAvailable()){
  setTimeout(()=>toast("Heads up: this browser is blocking saved progress"), 700);
}
</script>
</body>
